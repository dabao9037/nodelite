name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python sources
        run: python -m py_compile app/main.py netguard/netguard.py gateway/server.py
      - name: Verify REALITY preset list
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path("app/static/index.html").read_text(encoding="utf-8")
          script = Path("app/static/app.js").read_text(encoding="utf-8")
          for host in (
              "www.apple.com",
              "www.bing.com",
              "www.microsoft.com",
              "learn.microsoft.com",
              "www.samsung.com",
              "www.asus.com",
          ):
              assert f'value="{host}"' in page, host
              assert host in script, host
          for removed in (
              "www.amazon.com",
              "www.cloudflare.com",
              "addons.mozilla.org",
              "www.google.com",
              "www.oracle.com",
          ):
              assert f'value="{removed}"' not in page, removed
              assert removed not in script, removed
          assert "document.execCommand('copy')" in script
          PY
      - name: Verify release configuration
        run: |
          python - <<'PY'
          from pathlib import Path

          compose = Path("docker-compose.yml").read_text(encoding="utf-8")
          installer = Path("install.sh").read_text(encoding="utf-8")
          assert "ghcr.io/xtls/xray-core:26.6.27" in compose
          assert "ACCESS_PATH" in compose and "simple-node-gateway" in compose
          assert "ghcr.io/dabao9037/nodelite-panel:${IMAGE_TAG:-latest}" in compose
          assert Path("gateway/server.py").is_file()
          assert "TCPFit 网络调优" in installer
          assert "docker compose pull gateway panel netguard xray" in installer
          assert "快捷命令已安装" in installer
          PY
      - name: Run unit tests
        run: |
          python -m pip install -r requirements-dev.txt
          PYTHONPATH=. pytest -q

  fresh-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify empty-directory Compose startup
        run: sudo NODELITE_FRESH_INSTALL_TEST=1 bash scripts/test-fresh-install.sh

  publish-images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [static-checks, fresh-install]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish panel image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/dabao9037/nodelite-panel:latest
            ghcr.io/dabao9037/nodelite-panel:${{ github.sha }}
      - name: Publish netguard image
        uses: docker/build-push-action@v6
        with:
          context: ./netguard
          push: true
          tags: |
            ghcr.io/dabao9037/nodelite-netguard:latest
            ghcr.io/dabao9037/nodelite-netguard:${{ github.sha }}
      - name: Publish gateway image
        uses: docker/build-push-action@v6
        with:
          context: ./gateway
          push: true
          tags: |
            ghcr.io/dabao9037/nodelite-gateway:latest
            ghcr.io/dabao9037/nodelite-gateway:${{ github.sha }}
