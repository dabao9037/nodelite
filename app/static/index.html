<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f2ec">
  <meta name="robots" content="noindex,nofollow">
  <title>NodeLite</title>
  <link rel="stylesheet" href="static/app.css">
</head>
<body>
  <main class="shell">
    <header>
      <div class="brand"><b>N</b><span>NODELITE</span></div>
      <form method="post" action="logout"><button class="ghost">退出</button></form>
    </header>
    <section class="hero">
      <p class="eyebrow">MINIMAL XRAY NODE PANEL</p>
      <h1>节点管理，<em>实时可控。</em></h1>
      <p>VLESS + Reality、Shadowsocks 和 SOCKS，带真实流量、有效期和服务端设备数限制。</p>
    </section>
    <section class="builder">
      <div class="protocol-picker">
        <button class="protocol active" type="button" data-proto="vless">VLESS Reality<small>Vision + Reality</small></button>
        <button class="protocol" type="button" data-proto="shadowsocks">Shadowsocks<small>多种现代加密方式</small></button>
        <button class="protocol" type="button" data-proto="socks">SOCKS<small>账号密码代理</small></button>
      </div>
      <form id="createForm">
        <input type="hidden" id="protocol" value="vless">
        <div class="form-grid">
          <label>节点名称<input id="name" required placeholder="例如：新加坡-01"></label>
          <label>端口<input id="port" type="number" min="1" max="65535" placeholder="留空自动生成"></label>
          <label>对外 IP（可选，仅显示）
            <input id="advertisedHost" list="egressIpOptions" autocomplete="off" placeholder="留空使用面板地址">
            <datalist id="egressIpOptions"></datalist>
            <small>只改链接、二维码和订阅里显示的地址，用来填中转机 IP；不影响节点实际出网，填错也不会断。</small>
          </label>
          <label class="socks-field" hidden>用户名<input id="username" placeholder="留空自动生成"></label>
          <label class="socks-field" hidden>密码<input id="password" placeholder="留空自动生成"></label>
          <label class="ss-field" hidden>加密方式
            <select id="ssMethod">
              <option value="2022-blake3-aes-128-gcm">2022-blake3-aes-128-gcm</option>
              <option value="2022-blake3-aes-256-gcm">2022-blake3-aes-256-gcm</option>
              <option value="aes-128-gcm">aes-128-gcm</option>
              <option value="aes-256-gcm">aes-256-gcm</option>
              <option value="chacha20-poly1305">chacha20-poly1305</option>
            </select>
            <small id="ssMethodHelp">SS-2022 需要 Base64 编码、解码后恰好 16 字节的密钥。</small>
          </label>
          <label class="ss-field" hidden>密钥 / 密码<input id="ssPassword" placeholder="留空自动生成 16 字节 Base64 密钥"></label>
          <label class="vless-field">伪装目标
            <select id="realityPreset">
              <optgroup label="美国">
                <option value="www.debian.org">Debian · 开源操作系统（推荐）</option>
                <option value="www.postgresql.org">PostgreSQL · 开源数据库</option>
              </optgroup>
              <optgroup label="英国">
                <option value="www.skao.int">SKAO · 射电天文研究</option>
                <option value="www.sciencemuseum.org.uk">Science Museum · 科学教育</option>
              </optgroup>
              <optgroup label="日本">
                <option value="www.4gamer.net">4Gamer · 游戏媒体</option>
                <option value="www.famitsu.com">Famitsu · 游戏资讯</option>
              </optgroup>
              <optgroup label="东南亚">
                <option value="www.a-star.edu.sg">A*STAR · 新加坡科研</option>
                <option value="www.visitsingapore.com">Visit Singapore · 新加坡旅游</option>
              </optgroup>
              <optgroup label="欧洲">
                <option value="www.fraunhofer.de">Fraunhofer · 应用科研</option>
                <option value="www.gog.com">GOG · 波兰游戏平台</option>
              </optgroup>
              <optgroup label="香港">
                <option value="www.hkstp.org">HKSTP · 香港科技园</option>
                <option value="www.discoverhongkong.com">Discover Hong Kong · 香港旅游</option>
              </optgroup>
              <optgroup label="迪拜">
                <option value="www.visitdubai.com">Visit Dubai · 迪拜旅游局</option>
                <option value="www.dm.gov.ae">Dubai Municipality · 迪拜政务</option>
              </optgroup>
              <option value="custom">自定义域名</option>
            </select>
            <small>按地区各提供两个已验证支持 TLS 1.3、HTTP/2、证书匹配的目标；实际可用性仍以部署服务器实测为准。</small>
          </label>
          <label class="vless-field reality-custom-field" hidden>SNI 域名<input id="serverName" value="www.debian.org"><small>自定义时必须填写证书与 SNI 匹配、支持 TLS 1.3 的域名。</small></label>
          <label class="vless-field reality-custom-field" hidden>Reality 目标<input id="destination" value="www.debian.org:443"><small>自定义时使用“域名:443”，SNI 与目标域名保持一致。</small></label>
          <label>有效期
            <select id="expirationMode">
              <option value="never">永不过期</option>
              <option value="date">指定日期</option>
              <option value="days">指定天数</option>
            </select>
          </label>
          <label id="expirationDateField" hidden>到期日期<input id="expiresAt" type="datetime-local"></label>
          <label id="expirationDaysField" hidden>有效天数<input id="expiresInDays" type="number" min="1" max="3650" value="30"></label>
          <label>最大设备数<input id="maxDevices" type="number" min="1" max="100000" placeholder="留空表示不限"><small>按当前连接此节点的不同公网 IPv4 数量计算；同一 NAT 下多台设备计 1，切换网络后可能变化。受限节点暂不开放 IPv6。</small></label>
          <label>流量上限 (MB)<input id="trafficLimitMb" type="number" min="1" max="1000000000" step="1" placeholder="留空表示不限"><small>上传与下载累计合计达到上限后自动停用。</small></label>
        </div>
        <div id="error" class="error" role="alert" hidden></div>
        <button class="primary">生成节点 <b>→</b></button>
      </form>
    </section>
    <section class="nodes">
      <div class="title">
        <div><p class="eyebrow">LIVE NODE CONTROLS</p><h2>节点列表</h2><small class="live-note">每 2 秒刷新流量速率与活动设备数（不同公网 IPv4）</small></div>
        <button id="refresh" class="circle" type="button" aria-label="刷新节点列表">↻</button>
      </div>
      <div id="empty" class="empty">还没有节点，从上方创建第一个。</div>
      <div id="list"></div>
    </section>
    <footer>NodeLite <span id="version"></span> · Xray 节点控制面板</footer>
  </main>

  <dialog id="editDialog">
    <form id="editForm" method="dialog">
      <input id="editId" type="hidden">
      <h2>编辑节点控制</h2>
      <label>节点名称<input id="editName" required></label>
      <label>对外 IP（可选，仅显示）<input id="editAdvertisedHost" list="egressIpOptions" autocomplete="off" placeholder="留空使用面板地址"><small>只改链接、二维码和订阅里显示的地址，不影响节点实际出网。</small></label>
      <label>对外端口（可选）<input id="editAdvertisedPort" type="number" min="1" max="65535" placeholder="留空使用节点端口"><small>中转映射用：链接、二维码、订阅里显示这个端口，节点实际监听端口不变，不会断流。</small></label>
      <label>最大设备数<input id="editMaxDevices" type="number" min="1" max="100000" placeholder="留空表示不限"><small>按不同公网 IPv4 计数；同一 NAT 多设备计 1，切网后可能变化。受限节点暂不开放 IPv6。</small></label>
      <label>流量上限 (MB)<input id="editTrafficLimitMb" type="number" min="1" max="1000000000" step="1" placeholder="留空表示不限"><small>修改上限不会清除已用流量；因流量超限停用时，提高到当前用量以上或清除上限会自动启用（已到期或手动停用除外）。</small></label>
      <label>有效期
        <select id="editExpirationMode">
          <option value="never">永不过期</option>
          <option value="date">指定日期</option>
          <option value="days">从现在起指定天数</option>
        </select>
      </label>
      <label id="editExpirationDateField" hidden>到期日期<input id="editExpiresAt" type="datetime-local"></label>
      <label id="editExpirationDaysField" hidden>有效天数<input id="editExpiresInDays" type="number" min="1" max="3650" value="30"></label>
      <details class="advanced">
        <summary>高级：出口源 IP（影响出网）</summary>
        <label>出口源 IP<input id="editEgressIp" list="egressIpOptions" autocomplete="off" placeholder="留空表示不绑定"></label>
        <small>绑定节点出网用的源地址，必须是这台机器自己拥有的 IP。填中转机地址会让节点断网，一般留空。</small>
      </details>
      <div class="dialog-actions"><button id="editCancel" type="button">取消</button><button class="primary" type="submit">保存</button></div>
    </form>
  </dialog>
  <script src="static/app.js"></script>
</body>
</html>
