name: native-release

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify source semantics
        run: |
          python -m py_compile app/main.py netguard/netguard.py gateway/server.py native/*.py
          node --check app/static/app.js
          python scripts/verify_native_release.py .
      - name: Run native smoke and unit tests
        run: |
          bash scripts/test-native-smoke.sh
          bash scripts/test-native-systemd-sandbox.sh
          python scripts/test-native-db-snapshot.py
          PYTHONPATH=. pytest -q

  build:
    needs: verify
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Build standalone one-dir tarball in Debian 11 (GLIBC 2.31)
        run: bash scripts/build-native-release-container.sh "${{ matrix.arch }}"
      - name: Verify release GLIBC compatibility
        run: bash scripts/verify-glibc-compat.sh "dist/nodelite-linux-${{ matrix.arch }}.tar.gz" 2.31
      - uses: actions/upload-artifact@v4
        with:
          name: nodelite-linux-${{ matrix.arch }}
          path: dist/*
      - name: Attach assets to GitHub Release
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber
