name: native-release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing GitHub Release tag to receive the native assets"
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify source semantics
        run: |
          python -m py_compile app/main.py netguard/netguard.py gateway/server.py native/*.py
          node --check app/static/app.js
          python scripts/verify_native_release.py .
      - name: Run native smoke and unit tests
        run: |
          bash scripts/test-native-smoke.sh
          bash scripts/test-native-systemd-sandbox.sh
          python scripts/test-native-db-snapshot.py
          PYTHONPATH=. pytest -q

  build:
    needs: verify
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Build standalone one-dir tarball in Debian 11 (GLIBC 2.31)
        env:
          NODELITE_RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
        run: bash scripts/build-native-release-container.sh "${{ matrix.arch }}"
      - name: Verify release GLIBC compatibility
        run: bash scripts/verify-glibc-compat.sh "dist/nodelite-linux-${{ matrix.arch }}.tar.gz" 2.31
      - uses: actions/upload-artifact@v4
        with:
          name: nodelite-linux-${{ matrix.arch }}
          path: dist/*
      - name: Attach assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          test -n "$RELEASE_TAG"
          gh release view "$RELEASE_TAG"
          gh release upload "$RELEASE_TAG" dist/* --clobber

  verify-published-release:
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
    steps:
      - name: Verify latest release and all public native assets
        run: |
          set -Eeuo pipefail
          test -n "$RELEASE_TAG"
          release_json=$(gh api "repos/${{ github.repository }}/releases/tags/$RELEASE_TAG")
          asset_count=$(printf '%s' "$release_json" | jq '.assets | length')
          test "$asset_count" -eq 4
          work=$(mktemp -d)
          cd "$work"
          for arch in amd64 arm64; do
            base="https://github.com/${{ github.repository }}/releases/download/$RELEASE_TAG/nodelite-linux-$arch.tar.gz"
            curl -fL --retry 5 --retry-delay 2 "$base" -o "nodelite-linux-$arch.tar.gz"
            curl -fL --retry 5 --retry-delay 2 "$base.sha256" -o "nodelite-linux-$arch.tar.gz.sha256"
            expected=$(awk '{print $1}' "nodelite-linux-$arch.tar.gz.sha256")
            actual=$(sha256sum "nodelite-linux-$arch.tar.gz" | awk '{print $1}')
            test "$expected" = "$actual"
            mkdir "$arch"
            tar -C "$arch" -xzf "nodelite-linux-$arch.tar.gz"
            test "$(cat "$arch/VERSION")" = "$RELEASE_TAG"
            test "$(cat "$arch/BUILD_COMMIT")" = "$GITHUB_SHA"
            grep -q 'installed_version' "$arch/install.sh"
            grep -q '当前版本：%s' "$arch/install.sh"
            guard="$arch/source/netguard/netguard.py"
            test -f "$guard"
            # Single-family sets: names are built from SET_PREFIX plus a v4/v6
            # suffix, so assert the construction rather than a literal name.
            grep -q 'SET_PREFIX = "devices_"' "$guard"
            grep -q '"ipv4": "v4", "ipv6": "v6"' "$guard"
            grep -q 'type ipv4_addr' "$guard"
            grep -q 'type ipv6_addr' "$guard"
            # The v0.3.9 device-limit fix: full <family>-<action> role parsing,
            # cross-family rejection, rule order and per-node (not per-family) limits.
            grep -q 'matched.group(2)}-{matched.group(3)' "$guard"
            grep -q '_other_family' "$guard"
            grep -q 'installed_order != expected_order' "$guard"
            grep -q 'admitted = addresses\[:limit\]' "$guard"
          done
          echo "PUBLIC_NATIVE_RELEASE_VERIFIED $RELEASE_TAG $GITHUB_SHA"
