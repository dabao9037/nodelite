name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python sources
        run: python -m py_compile app/main.py netguard/netguard.py
      - name: Verify REALITY preset list
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path("app/static/index.html").read_text(encoding="utf-8")
          script = Path("app/static/app.js").read_text(encoding="utf-8")
          for host in (
              "www.apple.com",
              "www.amazon.com",
              "www.cloudflare.com",
              "addons.mozilla.org",
              "www.bing.com",
          ):
              assert f'value="{host}"' in page, host
              assert host in script, host
          for removed in ("www.microsoft.com", "www.oracle.com", "www.google.com"):
              assert f'value="{removed}"' not in page, removed
              assert removed not in script, removed
          PY
      - name: Verify release configuration
        run: |
          python - <<'PY'
          from pathlib import Path

          compose = Path("docker-compose.yml").read_text(encoding="utf-8")
          installer = Path("install.sh").read_text(encoding="utf-8")
          assert "ghcr.io/xtls/xray-core:26.6.27" in compose
          assert "ACCESS_PATH" in compose and "simple-node-gateway" in compose
          assert Path("gateway/server.py").is_file()
          assert "TCPFit 网络调优" in installer
          PY
      - name: Run unit tests
        run: |
          python -m pip install -r requirements-dev.txt
          PYTHONPATH=. pytest -q

  fresh-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify empty-directory Compose startup
        run: sudo NODELITE_FRESH_INSTALL_TEST=1 bash scripts/test-fresh-install.sh
