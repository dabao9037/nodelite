name: native-release

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Build standalone one-dir tarball in Debian 11 (GLIBC 2.31)
        run: bash scripts/build-native-release-container.sh "${{ matrix.arch }}"
      - name: Verify release GLIBC compatibility
        run: bash scripts/verify-glibc-compat.sh "dist/nodelite-linux-${{ matrix.arch }}.tar.gz" 2.31
      - uses: actions/upload-artifact@v4
        with:
          name: nodelite-linux-${{ matrix.arch }}
          path: dist/*
      - name: Attach assets to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber
